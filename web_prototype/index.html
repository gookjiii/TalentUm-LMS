<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TalentUm LMS - Elite Digital Campus</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            midnight: '#0B1120',
            glassBg: '#151E32',
            brand: {
              blue: '#2563EB',
              indigo: '#6366F1'
            },
            success: '#059669',
            warning: '#F59E0B',
            danger: '#EF4444'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Styles -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap');
    
    body {
      background: #0B1120;
      color: #F8FAFC;
      margin: 0;
      overflow: hidden; /* App-like feel */
    }

    /* Ambient Glow */
    .ambient-glow {
      position: fixed;
      top: -10%; left: -10%;
      width: 40vw; height: 40vw;
      background: radial-gradient(circle, rgba(37,99,235,0.15) 0%, rgba(11,17,32,0) 70%);
      border-radius: 50%;
      z-index: -1;
      pointer-events: none;
    }
    .ambient-glow-2 {
      position: fixed;
      bottom: -10%; right: -10%;
      width: 50vw; height: 50vw;
      background: radial-gradient(circle, rgba(99,102,241,0.1) 0%, rgba(11,17,32,0) 70%);
      border-radius: 50%;
      z-index: -1;
      pointer-events: none;
    }

    /* Glassmorphism */
    .glass-card {
      background: linear-gradient(145deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.01) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
      border-radius: 20px;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .glass-card:hover {
      transform: translateY(-2px);
      border-color: rgba(99, 102, 241, 0.3);
    }
    
    .glass-panel {
      background: rgba(21, 30, 50, 0.6);
      backdrop-filter: blur(20px);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Gradient utilities */
    .bg-primary-gradient {
      background: linear-gradient(to right, #2563EB, #6366F1);
    }
    .text-primary-gradient {
      background: linear-gradient(to right, #2563EB, #6366F1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Buttons */
    .btn-primary {
      background: linear-gradient(to right, #2563EB, #6366F1);
      color: white;
      font-weight: 700;
      border-radius: 16px;
      padding: 0.75rem 1.5rem;
      box-shadow: 0 4px 14px 0 rgba(37,99,235,0.2);
      transition: all 0.2s ease-in-out;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-primary:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px 0 rgba(37,99,235,0.3);
    }

    .btn-glass {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: white;
      border-radius: 16px;
      padding: 0.75rem 1.5rem;
      font-weight: 600;
      transition: all 0.2s ease-in-out;
    }
    .btn-glass:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(99,102,241,0.5);
    }

    /* Inputs */
    .glass-input {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 0.75rem 1rem;
      color: white;
      width: 100%;
      outline: none;
      transition: all 0.3s ease;
    }
    .glass-input:focus {
      border-color: #6366F1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
    }

    /* Avatars */
    .avatar {
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.1);
      object-fit: cover;
    }

    /* Animations */
    .animate-fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Layout constraints */
    #app-container {
      height: 100vh;
      display: flex;
    }
    #main-content {
      flex: 1;
      height: 100vh;
      overflow-y: auto;
      padding: 2rem;
    }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
  </style>
</head>
<body class="antialiased">
  <div class="ambient-glow"></div>
  <div class="ambient-glow-2"></div>

  <!-- Role Switcher (For Demo) -->
  <div class="fixed top-4 right-4 z-50 glass-card p-2 flex gap-2">
    <button onclick="setRole('student')" id="btn-role-student" class="btn-glass px-4 py-2 text-sm">Student</button>
    <button onclick="setRole('teacher')" id="btn-role-teacher" class="btn-glass px-4 py-2 text-sm">Teacher</button>
    <button onclick="setRole('parent')" id="btn-role-parent" class="btn-glass px-4 py-2 text-sm">Parent</button>
  </div>

  <div id="app-container">
    <!-- Desktop Sidebar -->
    <aside class="hidden md:flex flex-col w-72 glass-panel p-6 h-full z-40">
      <div class="flex items-center gap-3 mb-10">
        <div class="w-10 h-10 bg-primary-gradient rounded-xl flex items-center justify-center font-bold text-lg shadow-[0_0_15px_rgba(37,99,235,0.5)]">T</div>
        <h1 class="text-xl font-black tracking-tight text-white">TalentUm</h1>
      </div>

      <nav class="flex-1 flex flex-col gap-2" id="sidebar-nav">
        <!-- Rendered by JS -->
      </nav>

      <!-- Profile mini -->
      <div class="mt-auto pt-6 border-t border-white/5 flex items-center gap-3">
        <div class="relative">
          <img id="user-avatar" src="https://i.pravatar.cc/150?u=1" class="w-12 h-12 avatar" />
          <div class="absolute -bottom-1 -right-1 w-4 h-4 bg-success rounded-full border-2 border-midnight"></div>
        </div>
        <div>
          <p id="user-name" class="font-bold text-sm">Alex Student</p>
          <p id="user-role" class="text-xs text-slate-400">Student</p>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main id="main-content" class="relative">
      <!-- Injected by JS -->
    </main>

    <!-- Mobile Bottom Nav (Mock placeholder, hidden on md) -->
    <div class="md:hidden fixed bottom-0 left-0 right-0 glass-panel border-t border-white/5 flex justify-around p-4 z-40">
      <i data-lucide="layout-dashboard" class="w-6 h-6 text-brand-indigo"></i>
      <i data-lucide="message-square" class="w-6 h-6 text-slate-400"></i>
      <i data-lucide="calendar" class="w-6 h-6 text-slate-400"></i>
      <i data-lucide="user" class="w-6 h-6 text-slate-400"></i>
    </div>
  </div>

  <!-- Mock Data & Logic -->
  <script>
    // --- MOCK DATA ---
    const MOCK_DATA = {
      student: {
        name: "Alex Nguyen",
        avatar: "https://i.pravatar.cc/150?u=alex",
        gpa: "8.5",
        attendance: "95%",
        assignments: 3,
        timeline: [
          { time: "08:00 - 09:30", subject: "Toán Học Cao Cấp", room: "Phòng 102 - Cơ sở A", active: false },
          { time: "10:00 - 11:30", subject: "Lập trình Web", room: "Lab 3", active: true },
          { time: "13:30 - 15:00", subject: "Thiết kế UI/UX", room: "Online via Zoom", active: false }
        ],
        homework: [
          { title: "Bài tập lớn React", due: "Hôm nay, 23:59", status: "warning" },
          { title: "Báo cáo UI UX", due: "Ngày mai", status: "success" },
          { title: "Thiết kế Figma", due: "Trễ hạn 1 ngày", status: "danger" }
        ]
      },
      teacher: {
        name: "Dr. Elena Smith",
        avatar: "https://i.pravatar.cc/150?u=elena",
        gpa: "12 Lớp",
        attendance: "98%",
        assignments: 45, // grading
        timeline: [
          { time: "08:00 - 09:30", subject: "Giảng Toán Cao Cấp", room: "Phòng 102", active: false },
          { time: "13:30 - 15:00", subject: "Hướng dẫn Đồ án", room: "Online", active: true }
        ],
        homework: [
          { title: "Chấm điểm Đồ án Web", due: "30 bài chờ chấm", status: "warning" },
          { title: "Duyệt báo cáo tuần", due: "15 báo cáo", status: "success" }
        ]
      },
      parent: {
        name: "Michael Parent",
        avatar: "https://i.pravatar.cc/150?u=michael",
        gpa: "8.5 (Alex)",
        attendance: "95% Tuần này",
        assignments: 0,
        timeline: [
          { time: "09:00 Hôm nay", subject: "Alex đã nộp bài Toán", room: "Đạt 9/10", active: true },
          { time: "14:00 Hôm qua", subject: "Giáo viên gửi nhận xét", room: "Alex rất chăm chỉ", active: false }
        ],
        homework: [
          { title: "Họp phụ huynh", due: "Tuần sau, T7", status: "warning" },
          { title: "Học phí học kỳ 2", due: "Chờ thanh toán", status: "danger" }
        ]
      },
      chats: [
        { name: "Lớp Web Dev", lastMsg: "Nhớ nộp bài nhé!", time: "10:02", unread: 3, avatar: "https://i.pravatar.cc/150?u=class" },
        { name: "Dr. Elena", lastMsg: "Tuyệt vời em.", time: "Hôm qua", unread: 0, avatar: "https://i.pravatar.cc/150?u=elena" },
        { name: "Nhóm Đồ án", lastMsg: "Tối nay họp nhé", time: "T2", unread: 0, avatar: "https://i.pravatar.cc/150?u=group" }
      ]
    };

    // --- STATE ---
    let currentRole = 'student'; // 'student', 'teacher', 'parent'
    let currentTab = 'today'; // 'today', 'chat'

    // --- RENDER LOGIC ---
    function setRole(role) {
      currentRole = role;
      document.querySelectorAll('[id^="btn-role-"]').forEach(btn => {
        btn.classList.remove('bg-primary-gradient', 'border-transparent');
        btn.classList.add('bg-white/5');
      });
      document.getElementById(`btn-role-${role}`).classList.remove('bg-white/5');
      document.getElementById(`btn-role-${role}`).classList.add('bg-primary-gradient', 'border-transparent');
      
      const user = MOCK_DATA[role];
      document.getElementById('user-name').innerText = user.name;
      document.getElementById('user-role').innerText = role.charAt(0).toUpperCase() + role.slice(1);
      document.getElementById('user-avatar').src = user.avatar;

      if(currentRole === 'parent' && currentTab === 'chat') currentTab = 'today'; // parents maybe have different chat, keep it simple
      render();
    }

    function setTab(tab) {
      currentTab = tab;
      render();
    }

    function render() {
      // Render Nav
      const navMenu = [
        { id: 'today', icon: 'layout-dashboard', label: 'Dashboard' },
        { id: 'chat', icon: 'message-square', label: 'Messages' },
        { id: 'classes', icon: 'book-open', label: 'Classes' },
        { id: 'settings', icon: 'settings', label: 'Settings' }
      ];

      const navHtml = navMenu.map(item => `
        <button onclick="setTab('${item.id}')" class="flex items-center gap-3 w-full px-4 py-3 rounded-2xl transition-all ${currentTab === item.id ? 'bg-primary-gradient text-white shadow-[0_4px_14px_rgba(37,99,235,0.2)]' : 'text-slate-400 hover:text-white hover:bg-white/5'}">
          <i data-lucide="${item.icon}" class="w-5 h-5"></i>
          <span class="font-semibold text-sm">${item.label}</span>
        </button>
      `).join('');
      document.getElementById('sidebar-nav').innerHTML = navHtml;

      // Render Content
      const main = document.getElementById('main-content');
      main.innerHTML = '';

      if (currentTab === 'today') {
        main.innerHTML = renderTodayDashboard();
      } else if (currentTab === 'chat') {
        main.innerHTML = renderChatScreen();
      } else {
        main.innerHTML = `<div class="animate-fade-in flex flex-col items-center justify-center h-full text-slate-400">
          <i data-lucide="compass" class="w-16 h-16 mb-4 opacity-50"></i>
          <p class="font-mono">Work in progress...</p>
        </div>`;
      }

      lucide.createIcons();
    }

    // --- TEMPLATES ---
    function renderTodayDashboard() {
      const data = MOCK_DATA[currentRole];
      let heroTitle = currentRole === 'teacher' ? 'Tổng quan Giảng dạy' : currentRole === 'parent' ? 'Bảng theo dõi Phụ huynh' : 'Chào buổi sáng,';
      let heroAction = currentRole === 'teacher' ? 'Phân tích' : 'Vào lớp học';

      return `
        <div class="animate-fade-in max-w-6xl mx-auto pb-20">
          <!-- Hero -->
          <div class="flex flex-col md:flex-row items-start md:items-center justify-between mb-10 gap-4">
            <div>
              <h2 class="text-3xl md:text-4xl font-black tracking-tight mb-2">${heroTitle} <span class="text-primary-gradient">${data.name.split(' ')[0]}!</span></h2>
              <p class="text-slate-400 text-sm">Hôm nay bạn có ${data.assignments} nhiệm vụ cần hoàn thành.</p>
            </div>
            <button class="btn-primary">
              <i data-lucide="play" class="w-4 h-4"></i> ${heroAction}
            </button>
          </div>

          <!-- Quick Stats -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            ${statCard('Điểm số / Đánh giá', data.gpa, 'trending-up', 'text-success')}
            ${statCard('Bài tập / Nhiệm vụ', data.assignments.toString(), 'file-text', 'text-warning')}
            ${statCard('Chuyên cần', data.attendance, 'calendar-check', 'text-brand-indigo')}
          </div>

          <!-- 2 Col Layout -->
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- Timeline (Left, 7 cols) -->
            <div class="lg:col-span-7 space-y-4">
              <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
                <i data-lucide="clock" class="w-5 h-5 text-brand-indigo"></i> 
                ${currentRole === 'parent' ? 'Hoạt động gần đây' : 'Lịch trình hôm nay'}
              </h3>
              ${data.timeline.map((item, i) => `
                <div class="glass-card p-5 flex gap-4 ${item.active ? 'border-brand-indigo shadow-[0_0_20px_rgba(99,102,241,0.15)]' : ''}" style="animation-delay: ${i * 100}ms">
                  <div class="w-1.5 rounded-full ${item.active ? 'bg-brand-indigo' : 'bg-slate-700'}"></div>
                  <div class="flex-1">
                    <p class="font-mono text-xs text-slate-400 mb-1">${item.time}</p>
                    <p class="font-bold text-lg mb-1">${item.subject}</p>
                    <p class="text-sm text-slate-400 flex items-center gap-1">
                      <i data-lucide="map-pin" class="w-3 h-3"></i> ${item.room}
                    </p>
                  </div>
                  ${item.active ? `<button class="btn-primary self-center px-4 py-2 text-sm hidden md:flex">Tham gia</button>` : ''}
                </div>
              `).join('')}
            </div>

            <!-- Action Required (Right, 5 cols) -->
            <div class="lg:col-span-5 space-y-4">
               <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
                <i data-lucide="alert-circle" class="w-5 h-5 text-warning"></i> 
                Cần xử lý
              </h3>
              ${data.homework.map((item, i) => {
                const colors = { warning: 'text-warning bg-warning/10 border-warning/20', success: 'text-success bg-success/10 border-success/20', danger: 'text-danger bg-danger/10 border-danger/20' };
                return `
                <div class="glass-card p-5" style="animation-delay: ${i * 100 + 200}ms">
                  <div class="flex justify-between items-start mb-2">
                    <p class="font-bold">${item.title}</p>
                    <span class="px-2 py-1 rounded border font-mono text-[10px] uppercase font-bold tracking-wider ${colors[item.status]}">
                      ${item.status}
                    </span>
                  </div>
                  <p class="text-sm text-slate-400 font-mono">${item.due}</p>
                </div>
              `}).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function statCard(label, value, icon, iconColor) {
      return `
        <div class="glass-card p-6 flex items-center gap-4 animate-fade-in hover:scale-[1.02] transition-transform">
          <div class="w-12 h-12 rounded-2xl bg-white/5 flex items-center justify-center border border-white/10">
            <i data-lucide="${icon}" class="w-6 h-6 ${iconColor}"></i>
          </div>
          <div>
            <p class="text-sm text-slate-400 font-medium mb-1">${label}</p>
            <p class="text-2xl font-black font-mono">${value}</p>
          </div>
        </div>
      `;
    }

    function renderChatScreen() {
      const chats = MOCK_DATA.chats;
      return `
        <div class="animate-fade-in h-full flex gap-6 -m-2">
          <!-- Sidebar Chats -->
          <div class="w-80 flex flex-col h-[calc(100vh-4rem)]">
            <div class="mb-4">
              <h2 class="text-2xl font-black mb-4">Messages</h2>
              <div class="relative">
                <i data-lucide="search" class="absolute left-3 top-3 w-4 h-4 text-slate-400"></i>
                <input type="text" placeholder="Tìm kiếm liên hệ..." class="glass-input pl-10">
              </div>
            </div>
            
            <div class="flex-1 overflow-y-auto space-y-2 pr-2">
              ${chats.map((c, i) => `
                <div class="glass-card p-3 flex items-center gap-3 cursor-pointer hover:bg-white/5 ${i===0 ? 'bg-white/5 border-brand-indigo/50' : ''}">
                  <img src="${c.avatar}" class="w-12 h-12 avatar rounded-full" />
                  <div class="flex-1 min-w-0">
                    <div class="flex justify-between items-center mb-1">
                      <p class="font-bold text-sm truncate">${c.name}</p>
                      <p class="text-[10px] text-slate-400 font-mono">${c.time}</p>
                    </div>
                    <p class="text-xs text-slate-400 truncate">${c.lastMsg}</p>
                  </div>
                  ${c.unread > 0 ? `<div class="w-5 h-5 rounded-full bg-danger text-white text-[10px] font-bold flex items-center justify-center">${c.unread}</div>` : ''}
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Chat Area -->
          <div class="flex-1 glass-card flex flex-col h-[calc(100vh-4rem)] relative overflow-hidden">
            <!-- Header -->
            <div class="p-4 border-b border-white/10 flex justify-between items-center bg-white/5">
              <div class="flex items-center gap-3">
                <img src="${chats[0].avatar}" class="w-10 h-10 avatar rounded-full" />
                <div>
                  <p class="font-bold">${chats[0].name}</p>
                  <p class="text-xs text-success flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-success"></span> Online</p>
                </div>
              </div>
              <div class="flex gap-2">
                <button class="p-2 rounded-xl hover:bg-white/10 text-brand-indigo"><i data-lucide="video" class="w-5 h-5"></i></button>
                <button class="p-2 rounded-xl hover:bg-white/10 text-slate-400"><i data-lucide="more-vertical" class="w-5 h-5"></i></button>
              </div>
            </div>

            <!-- Messages -->
            <div class="flex-1 p-6 overflow-y-auto flex flex-col gap-4">
              <div class="text-center text-xs text-slate-500 font-mono mb-4">Hôm nay</div>
              
              <!-- Other -->
              <div class="flex items-end gap-2 max-w-[80%]">
                <img src="${chats[0].avatar}" class="w-8 h-8 avatar rounded-full" />
                <div>
                  <div class="bg-white/5 border border-white/10 p-3 rounded-2xl rounded-tl-sm text-sm">
                    Các em nhớ nộp bài tập đúng hạn nhé! Ngày mai mình sẽ review.
                  </div>
                  <p class="text-[10px] text-slate-500 mt-1 font-mono">10:00</p>
                </div>
              </div>

              <!-- Me -->
              <div class="flex items-end gap-2 max-w-[80%] self-end flex-row-reverse">
                <div class="w-8 h-8 rounded-full border border-white/10 overflow-hidden flex-shrink-0">
                  <img src="${MOCK_DATA.student.avatar}" class="w-full h-full object-cover" />
                </div>
                <div class="flex flex-col items-end">
                  <div class="bg-primary-gradient shadow-[0_4px_14px_rgba(37,99,235,0.2)] p-3 rounded-2xl rounded-tr-sm text-sm text-white">
                    Vâng ạ, em đã hoàn thành xong phần giao diện rồi cô nhé.
                  </div>
                  <p class="text-[10px] text-slate-500 mt-1 font-mono">10:02</p>
                </div>
              </div>
            </div>

            <!-- Input -->
            <div class="p-4 bg-white/5 border-t border-white/10">
              <div class="flex items-center gap-2 bg-midnight/50 p-2 rounded-2xl border border-white/10 focus-within:border-brand-indigo transition-colors">
                <button class="p-2 text-slate-400 hover:text-white"><i data-lucide="paperclip" class="w-5 h-5"></i></button>
                <input type="text" placeholder="Nhập tin nhắn..." class="flex-1 bg-transparent text-white text-sm outline-none px-2">
                <button class="w-10 h-10 rounded-xl bg-primary-gradient flex items-center justify-center text-white shadow-[0_4px_14px_rgba(37,99,235,0.3)] hover:scale-105 transition-transform">
                  <i data-lucide="send" class="w-4 h-4 ml-1"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // Init
    setRole('student'); // Automatically renders
  </script>
</body>
</html>

name: 🚀 TalentUm Multi-Platform Build

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: 'stable'

jobs:
  # ─────────────────────────────────────────
  # 🤖 Android APK
  # ─────────────────────────────────────────
  build-android:
    name: 🤖 Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build APK (release)
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  # ─────────────────────────────────────────
  # 🪟 Windows EXE
  # ─────────────────────────────────────────
  build-windows:
    name: 🪟 Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/windows/x64/runner/Release/
          retention-days: 30

  # ─────────────────────────────────────────
  # 🍎 macOS App
  # ─────────────────────────────────────────
  build-macos:
    name: 🍎 macOS App
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Enable macOS desktop & disable SPM auto-migration
        run: |
          flutter config --enable-macos-desktop
          flutter config --no-enable-swift-package-manager

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: macos/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('macos/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods dependencies
        run: |
          cd macos
          pod repo update --silent
          pod install --repo-update
        
      - name: Build macOS (release)
        run: |
          flutter build macos --release \
            --dart-define=GOOGLE_DRIVE_PROXY_URL="https://vercel-talentum-backend.vercel.app" \
            --dart-define=CLOUDINARY_CLOUD_NAME=dp50nlimq \
            --dart-define=CLOUDINARY_UPLOAD_PRESET=schoolWorld \
            --dart-define=APP_API_SECRET=talentum2026secret

      - name: Package as DMG (optional)
        run: |
          brew install create-dmg
          create-dmg \
            --volname "TalentUm" \
            --window-pos 200 120 \
            --window-size 600 300 \
            --icon-size 100 \
            --app-drop-link 425 120 \
            "TalentUm.dmg" \
            "build/macos/Build/Products/Release/school_world.app"
        continue-on-error: true # DMG packaging is optional

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            build/macos/Build/Products/Release/school_world.app
            TalentUm.dmg
          retention-days: 30

  # ─────────────────────────────────────────
  # 📱 iOS Build (No Codesign)
  # ─────────────────────────────────────────
  build-ios:
    name: 📱 iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-ios-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-ios-pods-

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
        
      - name: Build iOS (release)
        run: flutter build ios --release --no-codesign

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: build/ios/iphoneos/*.app
          retention-days: 30

  # ─────────────────────────────────────────
  # 🌐 Web → Firebase Hosting
  # ─────────────────────────────────────────
  build-and-deploy-web:
    name: 🌐 Web → Firebase
    runs-on: ubuntu-latest
    # Only deploy on push to main/master (not PRs)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build Web (release)
        run: |
          flutter build web --release \
            --dart-define=GOOGLE_DRIVE_PROXY_URL="https://vercel-talentum-backend.vercel.app" \
            --dart-define=CLOUDINARY_CLOUD_NAME=dp50nlimq \
            --dart-define=CLOUDINARY_UPLOAD_PRESET=schoolWorld \
            --dart-define=APP_API_SECRET=talentum2026secret

      - name: Force new deploy hash
        run: echo "<!-- DEPLOY_TS_$(date +%s) -->" >> build/web/index.html

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT_SCHOOL_WOLRD: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_SCHOOL_WOLRD" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          npx --yes firebase-tools@12.9.1 deploy \
            --only hosting \
            --project school-wolrd \
            --non-interactive

  # ─────────────────────────────────────────
  # 📦 Create GitHub Release (on tag)
  # ─────────────────────────────────────────
  create-release:
    name: 📦 GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-windows, build-macos, build-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-apk/*.apk
            windows-release/**
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

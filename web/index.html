<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="description" content="TalentUm — Elite Digital Campus for teachers and students: feed, assignments, schedule, and school chat.">
  <meta name="theme-color" content="#7C3AED">
  <meta name="mobile-web-app-capable" content="yes">

  <meta name="google-signin-client_id" content="813433082673-4ein9utmin4551tfhp7hd6om6kdosad2.apps.googleusercontent.com">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TalentUm">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TalentUm</title>
  <link rel="manifest" href="manifest.json">

  <!-- PDF.js for Web PDF Viewer support -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script type="text/javascript">
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    }
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #flutter-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: #F8FAFC;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }

    #flutter-loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-logo {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #7C3AED, #9F67FF);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.3);
    }

    .loading-logo svg {
      width: 36px;
      height: 36px;
      fill: white;
    }

    .loading-title {
      font-size: 22px;
      font-weight: 800;
      color: #0F172A;
      letter-spacing: -0.5px;
    }

    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(124, 58, 237, 0.2);
      border-top-color: #7C3AED;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-color-scheme: dark) {
      body { background: #0F0F1A; }
      #flutter-loading { background: #0F0F1A; }
      .loading-title { color: #F0F0FF; }
    }
  </style>
</head>
<body>
  <div id="recaptcha-container"></div>
  <div id="flutter-loading">
    <div class="loading-logo">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/>
      </svg>
    </div>
    <span class="loading-title">TalentUm</span>
    <div class="loading-spinner"></div>
  </div>

  <script>
    // removed deprecated flutterConfiguration
    
    window._flutterLoaded = false;
    window._hideFlutterLoading = function() {
      if (window._flutterLoaded) return;
      window._flutterLoaded = true;
      var el = document.getElementById('flutter-loading');
      if (el) {
        el.classList.add('hidden');
        setTimeout(function() { el.remove(); }, 500);
      }
    };

    // Failsafe: hide loading after 8 seconds regardless
    setTimeout(window._hideFlutterLoading, 8000);
  </script>

  <script>
    // Flutter's generated worker is optional and unregisters itself on newer
    // releases. Only perform an update check when a registration really exists
    // so normal page loads do not wait on navigator.serviceWorker.ready.
    if ('serviceWorker' in navigator) {
      let isRefreshing = false;

      navigator.serviceWorker.addEventListener('controllerchange', function() {
        if (!isRefreshing) {
          isRefreshing = true;
          window.location.reload();
        }
      });

      function checkForUpdates() {
        navigator.serviceWorker.getRegistration().then(function(registration) {
          if (!registration) return;
          registration.update().catch(function() {});
          if (registration.waiting) {
            registration.waiting.postMessage({ type: 'SKIP_WAITING' });
          }
        }).catch(function() {});
      }

      checkForUpdates();
      setInterval(checkForUpdates, 5 * 60 * 1000);
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') checkForUpdates();
      });
      window.addEventListener('pageshow', checkForUpdates);
      window.addEventListener('focus', checkForUpdates);
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
